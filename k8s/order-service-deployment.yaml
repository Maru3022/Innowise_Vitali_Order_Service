apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: SERVER_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: KAFKA_CONSUMER_GROUP_ID
            - name: KAFKA_TOPIC_CREATE_PAYMENT
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: KAFKA_TOPIC_CREATE_PAYMENT
            - name: KAFKA_TOPIC_PAYMENT_RESULT
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: KAFKA_TOPIC_PAYMENT_RESULT
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: USER_SERVICE_URL
            - name: SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: SCHEMA_REGISTRY_URL
            - name: SPRING_LIQUIBASE_CHANGE_LOG
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: SPRING_LIQUIBASE_CHANGE_LOG
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
